<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — TEST</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Black+Ops+One&family=Chicle&family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nokora:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pliant:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">TEST</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-right">
        <div class="user-chip">
          <span class="avatar">U</span><span class="uname">User</span>
          <button class="logout" onclick="logout()" title="Log out"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
        <a href="login.html" class="btn btn-primary btn-sm nav-login-btn"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</a>
        <button class="nav-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </nav>

  <main class="auth-wrap">
    <span class="orb orb-1" style="top:10%; left:5%;"></span>
    <span class="orb orb-2" style="bottom:5%; right:5%; top:auto;"></span>

    <div class="auth-card">
      <div class="auth-head">
        <div class="logo-badge" style="background:var(--gradient-2);"><i class="fa-solid fa-key" style="color:#fff;"></i></div>
        <h2>Reset your password</h2>
        <p>Enter your email and we'll send you a code to reset it.</p>
      </div>

      <!-- Step 1: request code -->
      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa-solid fa-paper-plane"></i> Send Reset Code
        </button>

        <div class="auth-foot">
          Remembered it? <a href="login.html">Back to login</a>
        </div>
      </form>

      <!-- Step 2: verify code + new password (shown after code is sent) -->
      <div id="reset-sent" style="display:none; margin-top:26px;">
        <div style="background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px; margin-bottom:22px; text-align:center;">
          <i class="fa-solid fa-envelope-circle-check" style="font-size:1.8rem; color:var(--success);"></i>
          <p style="margin-top:10px; color:var(--text-dim); font-size:.9rem;">
            A reset code has been "sent" to<br />
            <strong class="reset-email" style="color:var(--text);"></strong>
          </p>
          <p style="margin-top:12px; font-size:.82rem; color:var(--text-mute);">
            <i class="fa-solid fa-circle-info"></i>
            Demo mode — your code is:
            <span class="reset-code" style="font-family:'Black Ops One',sans-serif; font-size:1.2rem; color:var(--primary); letter-spacing:3px;"></span>
          </p>
        </div>

        <form id="verify-form" novalidate>
          <div class="form-group">
            <label for="code">Reset code</label>
            <div class="input-wrap">
              <i class="fa-solid fa-shield-halved"></i>
              <input type="text" id="code" class="form-control" placeholder="Enter 6-digit code" inputmode="numeric" maxlength="6" />
            </div>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="new-password">New password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="new-password" class="form-control" placeholder="At least 6 characters" autocomplete="new-password" />
              <button type="button" class="pass-toggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
            </div>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm new password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" autocomplete="new-password" />
              <button type="button" class="pass-toggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
            </div>
            <div class="form-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-check"></i> Reset Password
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
