<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — TEST</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Black+Ops+One&family=Chicle&family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nokora:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pliant:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">TEST</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-right">
        <div class="user-chip">
          <span class="avatar">U</span><span class="uname">User</span>
          <button class="logout" onclick="logout()" title="Log out"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
        <a href="login.html" class="btn btn-primary btn-sm nav-login-btn"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</a>
        <button class="nav-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </nav>

  <main class="auth-wrap">
    <span class="orb orb-1" style="top:10%; left:5%;"></span>
    <span class="orb orb-2" style="bottom:5%; right:5%; top:auto;"></span>

    <div class="auth-card">
      <div class="auth-head">
        <div class="logo-badge">T</div>
        <h2>Welcome back</h2>
        <p>Log in to continue to TEST</p>
      </div>

      <div class="auth-tabs">
        <a href="login.html" class="active">Login</a>
        <a href="signup.html">Sign Up</a>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" />
            <button type="button" class="pass-toggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="form-error"></div>
        </div>

        <div class="check-row">
          <label><input type="checkbox" id="remember" /> Remember me</label>
          <a href="forgot.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Log In
        </button>

        <div class="auth-divider">or continue with</div>

        <div style="display:flex; gap:12px;">
          <button type="button" class="btn btn-ghost btn-block" onclick="toast('Social login is a demo.','info')">
            <i class="fa-brands fa-google"></i> Google
          </button>
          <button type="button" class="btn btn-ghost btn-block" onclick="toast('Social login is a demo.','info')">
            <i class="fa-brands fa-github"></i> GitHub
          </button>
        </div>

        <button type="button" id="demo-login" class="btn btn-block" style="margin-top:14px; background:var(--surface-2); color:var(--primary); border:1px dashed var(--primary);">
          <i class="fa-solid fa-bolt"></i> Try Demo Login (demo / demo123)
        </button>
      </form>

      <div class="auth-foot">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
